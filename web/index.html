<!doctype html>
<!-- The lang below and the list in the script further down are both injected at build time from
     the files in src/i18n/locales (see scripts/locales.mjs and the vite plugin that uses it), so
     adding a language stays a one-file change.

     It matters because i18n only sets documentElement.lang once it has loaded, which is after the
     first paint — so without this the document is unlabelled for the whole boot, and a screen
     reader has already chosen a voice by then. -->
<html lang="__APP_DEFAULT_LOCALE__">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <title>Diary</title>
    <!-- Not translated, and deliberately so: this is read by crawlers and link unfurlers before
         any locale has been detected, and it describes an app nobody reaches without an account.
         `robots` restates web/public/robots.txt at the page level, because a URL shared directly
         is fetched by things that never asked for robots.txt. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="A personal diary crossed with a tiny CRM." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Diary" />
    <meta property="og:title" content="Diary" />
    <meta property="og:description" content="A personal diary crossed with a tiny CRM." />
    <meta property="og:url" content="https://diary.tablerus.es/" />
    <meta property="og:image" content="https://diary.tablerus.es/icons/icon-512.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="The Diary logo" />
    <meta name="twitter:card" content="summary" />
    <script type="module">
      const isLocalDevelopment = import.meta.env.IS_LOCAL_DEVELOPMENT === 'true';
      const favicon = document.querySelector('link[rel="icon"]');

      if (favicon) {
        favicon.href = isLocalDevelopment ? '/favicon-local.svg' : '/favicon.svg';
      }

      const title = document.querySelector('title');
      if (title) {
        title.textContent = isLocalDevelopment ? '[DEV] Diary' : 'Diary';
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme') || 'auto';
          var dark =
            theme === 'dark' ||
            (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}

        /* Same idea as the theme above, for the same reason: correct before the first paint
           rather than a moment after it. 'lang' is i18next's lookupLocalStorage key (see
           src/i18n), and the stored value can be regional — es-ES, zh-CN — so only the base
           subtag is used, and only if it is one this app actually ships. Anything else leaves
           the injected default in place. */
        try {
          var stored = localStorage.getItem('lang');
          if (stored) {
            var base = stored.toLowerCase().split('-')[0];
            if (__APP_LOCALES__.indexOf(base) !== -1) {
              document.documentElement.lang = base;
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <style>
      /* The splash screen animation is the only thing containing a highlight color in the app,
         matching my personal's portfolio brand (https://tablerus.es/)
         The rest of the app is purposefully achromatic except for the importance scale and the
         user's own defined colors. */
      :root {
        --boot-splash-bg: #fafafa;
        --boot-splash-logo: rgb(0, 114, 255);
      }
      html.dark {
        --boot-splash-bg: #18181b;
        --boot-splash-logo: rgb(0, 114, 255);
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        background: var(--boot-splash-bg);
        transition: opacity 0.25s ease;
      }
      #boot-splash path {
        fill: none;
        stroke: var(--boot-splash-logo);
        stroke-width: 50px;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: d 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      }
      #boot-splash.morph .bs-h {
        d: path('M 200 250 L 100 250');
      }
      #boot-splash.morph .bs-c {
        d: path('M 175 100 L 400 250 L 175 400');
      }
      #boot-splash.morph .bs-v {
        d: path('M 100 100 L 100 400');
      }
      #boot-splash.fade {
        opacity: 0;
        pointer-events: none;
      }
      /* The morph is the thing being asked about; the fade stays, since a cross-fade is what
         "no animation" usually still means and cutting it would flash. */
      @media (prefers-reduced-motion: reduce) {
        #boot-splash path {
          transition: none;
        }
      }
    </style>

    <div id="boot-splash" aria-hidden="true" style="display: flex">
      <svg viewBox="0 0 500 500" width="120" height="120">
        <path class="bs-h" d="M 375 250 L 50 250" />
        <path class="bs-c" d="M 300 125 L 375 250 L 300 375" />
        <path class="bs-v" d="M 450 100 L 450 400" />
      </svg>
    </div>

    <script>
      (function () {
        var el = document.getElementById('boot-splash');
        var isNative = !!(
          window.Capacitor &&
          window.Capacitor.isNativePlatform &&
          window.Capacitor.isNativePlatform()
        );
        if (!isNative) {
          el.remove();
          return;
        }

        // Asked for calm: no logo morph, and — more to the point — none of the 1150 ms the app
        // otherwise spends *waiting* for that morph to finish. The splash then lasts exactly as
        // long as the app takes to render, and leaves on a plain fade.
        var reduceMotion =
          window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        el.style.display = 'flex';
        var start = Date.now();

        // 350 ms base-state wait before starting the morph
        if (!reduceMotion) {
          setTimeout(function () {
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                el.classList.add('morph');
              });
            });
          }, 350);
        }

        // Called from main.tsx once React has rendered
        window.__bootSplashHide = function () {
          var now = Date.now();
          // 350 ms delay + 600 ms morph + 200 ms after = 1150 ms from start
          var fadeStart = start + 1150;
          var wait = reduceMotion ? 0 : Math.max(0, fadeStart - now);
          setTimeout(function () {
            el.classList.add('fade');
            setTimeout(function () {
              el.remove();
            }, 300);
          }, wait);
        };
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
