// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

/*
 * Keep Meta's SDK out of the app.
 *
 * Only Google sign-in is ever used, but @capgo/capacitor-social-login bundles every provider by
 * default and its Facebook path pulls in com.facebook.android:facebook-login, which drags
 * facebook-core behind it and adds four advertising permissions to the merged manifest
 * (ACCESS_ADSERVICES_AD_ID / ATTRIBUTION / CUSTOM_AUDIENCE / TOPICS). In a diary, that is not a
 * dependency question — those permissions are on the app's own listing.
 *
 * The plugin does offer an opt-out, and gradle.properties sets it. It does not work on its own:
 * the plugin ships its *own* gradle.properties inside node_modules with
 * `socialLogin.facebook.include=true`, and for a given subproject Gradle reads the properties file
 * in that project's directory in preference to the root's. So the plugin silently overrides the
 * app's choice, and because the file is regenerated by the plugin's install hook, editing it there
 * would not survive `npm ci` either.
 *
 * Forcing the property here is what actually settles it, and it has to be `beforeEvaluate` so the
 * value is in place before the plugin's own build script reads it. Setting the property rather
 * than just excluding the dependency matters: the same flag also switches the plugin's sources
 * over to its bundled `facebookStubs`, so the module still compiles. An exclude on its own would
 * strip the classes out from under code that still references them.
 */
subprojects { subproject ->
    if (subproject.name == 'capgo-capacitor-social-login') {
        subproject.beforeEvaluate {
            subproject.ext.set('socialLogin.facebook.include', 'false')
            subproject.ext.set('socialLogin.apple.include', 'false')
            subproject.ext.set('socialLogin.twitter.include', 'false')
        }
        // Belt to the braces above: if a future version of the plugin renames the flag, the build
        // fails loudly at resolution instead of quietly shipping the SDK again.
        subproject.configurations.configureEach {
            exclude group: 'com.facebook.android'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
